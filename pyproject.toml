[build-system]
requires = ["setuptools>=61.0", "wheel", "cffi>=1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lobpy"
version = "1.2.0"
description = "Limit Order Book in Python"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Mattia"}
]
keywords = ["limit order book", "lob", "trading", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
 dependencies = [    
     "numpy>=1.20.0",
     "pandas>=1.3.0",
     "cffi>=1.0.0",
 ]

[project.optional-dependencies]
export = [
    "pyarrow>=7.0.0",
    "openpyxl>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/mattermat/lob.py"
"Bug Reports" = "https://github.com/mattermat/lob.py/issues"
Source = "https://github.com/mattermat/lob.py"

[tool.setuptools.packages.find]
include = ["lobpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = []

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "N", "W"]
target-version = "py38"
exclude = ["examples/itch.py"]

[tool.ruff.lint.per-file-ignores]
"lobpy/sortedlist.py" = ["N805"]
"lobpy/sortedset.py" = ["N805"]
"tests/test_lob.py" = ["F401"]
"tests/test_lobts.py" = ["F401"]
"lobpy/gueant.py" = ["N806"]
"lobpy/vpin.py" = ["N806"]
"tests/test_tl.py" = ["N806"]
"tests/test_vpin.py" = ["N806"]
"lobpy/itch.py" = ["N801"]
"examples/timeline.py" = ["N806"]
"examples/real_timeline.py" = ["N806"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lobpy.sortedlist"
ignore_errors = true

[[tool.mypy.overrides]]
module = "lobpy.sortedset"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyarrow"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.compute"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.parquet"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lobpy.sorteddict"
ignore_errors = true
